version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: shop-next-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop_next
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: shop-next-adminer
    restart: unless-stopped

    ports:
      - "8080:8080"

    depends_on:
      - postgres
volumes:
  postgres_data:
